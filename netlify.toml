# Deploy su Netlify (piano gratuito). Next.js è riconosciuto in automatico:
# l'adattatore OpenNext di Netlify trasforma le route in funzioni e il proxy
# in una Edge Function, senza configurazione aggiuntiva.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Stessa versione della CI (.github/workflows/deploy.yml).
  NODE_VERSION = "24"

# Su Netlify gli header di next.config.ts arrivano solo alle pagine Next:
# la home (route handler che serve public/index.html) e i file statici di
# public/ ne restano senza. Li ripetiamo qui per tutte le risposte.
# Tenere allineato con securityHeaders in next.config.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
