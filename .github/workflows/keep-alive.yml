    # Lun e Gio, ben sotto i 7 giorni di inattivita' che fanno pausare
    # automaticamente il progetto Supabase free tier.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkd3F3bGlya3VpemtldW1zaGJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzg2MTIsImV4cCI6MjA5NDg1NDYxMn0.mzkXcKRe0g2xhnlLMcEiOzC9KxX_p7e63Bv6U-klpHI"
          curl -sf -o /dev/null -w '%{http_code}\n' \
            "https://edwqwlirkuizkeumshbg.supabase.co/rest/v1/" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
